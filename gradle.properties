org.gradle.jvmargs=-Xmx8192m -XX:MaxMetaspaceSize=2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.java.home=D:/Java/jdk-21

# The project lives under a non-ASCII path (Desktop\工作); AGP works fine for a
# pure Kotlin/Java project, this only silences the Windows path warning.
android.overridePathCheck=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# MiuiX requires compileSdk 37 while this AGP release officially maxes out at 36.
android.suppressUnsupportedCompileSdk=37,37.0

# R8 full mode is very slow on the large MiuiX icon set; partial mode still shrinks well.
android.enableR8.fullMode=false
